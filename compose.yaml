services:
  foodtopia:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      FOODTOPIA_DEMO_MODE: ${FOODTOPIA_DEMO_MODE:-true}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      FOODTOPIA_ADMIN_LOGIN_ENABLED: ${FOODTOPIA_ADMIN_LOGIN_ENABLED:-false}
      FOODTOPIA_ADMIN_USERNAME: ${FOODTOPIA_ADMIN_USERNAME:-}
      FOODTOPIA_ADMIN_EMAIL: ${FOODTOPIA_ADMIN_EMAIL:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-5.6-terra}
      OPENAI_RECIPE_MODEL: ${OPENAI_RECIPE_MODEL:-gpt-5.6-luna}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-}
      OPENROUTER_RECIPE_MODEL: ${OPENROUTER_RECIPE_MODEL:-}
      HOUSEHOLD_AI_CREDENTIAL_KEYRING: ${HOUSEHOLD_AI_CREDENTIAL_KEYRING:-{}}
      HOUSEHOLD_AI_CREDENTIAL_ACTIVE_KEY_ID: ${HOUSEHOLD_AI_CREDENTIAL_ACTIVE_KEY_ID:-}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
    restart: unless-stopped
