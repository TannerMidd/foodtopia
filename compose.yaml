include:
  - path: docker/supabase/docker-compose.yml
    env_file: docker/supabase/local.env

services:
  foodtopia-init:
    image: postgres:17-alpine
    depends_on:
      storage:
        condition: service_healthy
    environment:
      PGPASSWORD: foodtopia-local-postgres-password
    volumes:
      - ./supabase:/foodtopia:ro
      - ./docker/foodtopia-init.sh:/init.sh:ro
    command: ["/init.sh"]
    restart: "no"

  foodtopia:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_SUPABASE_URL: http://supabase.localhost:8000
        NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWxvY2FsIiwiaWF0IjoxNzg3NzQ5MjAwLCJleHAiOjIxMDMzMDcyMDB9.qoa47DYTvdqnNp2O54CqkaZxrJNzlLI8aVScF3MBm04
    depends_on:
      api-gw:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
      foodtopia-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://supabase.localhost:8000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWxvY2FsIiwiaWF0IjoxNzg3NzQ5MjAwLCJleHAiOjIxMDMzMDcyMDB9.qoa47DYTvdqnNp2O54CqkaZxrJNzlLI8aVScF3MBm04
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UtbG9jYWwiLCJpYXQiOjE3ODc3NDkyMDAsImV4cCI6MjEwMzMwNzIwMH0.FLgOzMqFGYxGHpwj_wWXSXsseD2aN6dAUtUnUPoD5Ic
      FOODTOPIA_ADMIN_LOGIN_ENABLED: "true"
      FOODTOPIA_ADMIN_USERNAME: Admin
      FOODTOPIA_ADMIN_EMAIL: admin@foodtopia.local
      OPENAI_VISION_MODEL: gpt-5.6-terra
      OPENAI_RECIPE_MODEL: gpt-5.6-luna
      HOUSEHOLD_AI_CREDENTIAL_KEYRING: '{"local":"Zm9vZHRvcGlhLWxvY2FsLWhvdXNlaG9sZC1rZXkhISE="}'
      HOUSEHOLD_AI_CREDENTIAL_ACTIVE_KEY_ID: local
      INNGEST_DEV: "1"
      INNGEST_BASE_URL: http://inngest:8288
    restart: unless-stopped

  inngest:
    image: inngest/inngest:v1.39.0
    command: ["inngest", "dev", "-u", "http://foodtopia:3000/api/inngest"]
    depends_on:
      foodtopia:
        condition: service_started
    ports:
      - "8288:8288"
      - "8289:8289"
    restart: unless-stopped

  mail:
    image: inbucket/inbucket:3.0.3
    ports:
      - "9000:9000"
    restart: unless-stopped
